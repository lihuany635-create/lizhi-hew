<!doctype html><html><head><meta charset="utf-8"><title>Hew embed isolated mock</title></head><body>
<script>
  const owner={id:'11111111-1111-4111-8111-111111111111',email:'owner@example.test'};
  window.__lizhiEmbedTrace=[];
  let sid='',doc='',revision='',claimed=false;
  window.LizhiAuth={allowedEmail:owner.email,client:{
    auth:{getUser:async()=>({data:{user:owner},error:null})},
    rpc:async(name,params)=>{
      window.__lizhiEmbedTrace.push({name,params});
      let data=null;
      if(name==='lizhi_model_begin'){sid=params.p_session;doc=params.p_document;revision=params.p_revision;data=true;}
      else if(name==='lizhi_model_heartbeat')data=params.p_session===sid;
      else if(name==='lizhi_model_claim'&&!claimed){
        // Force a real tab switch before the WASM mutation and DB ACK.
        await new Promise(resolve=>setTimeout(resolve,1800));
        claimed=true;
        data={job_id:'33333333-3333-4333-8333-333333333333',
          request_id:'44444444-4444-4444-8444-444444444444',
          session_id:sid,document_id:doc,expected_revision:revision,
          command:'create_box',
          params:{origin_m:[0,0,0],size_m:[1.2,0.6,0.75],name:'Hew Smoke'}};
      }else if(['lizhi_model_finish','lizhi_model_close','lizhi_model_publish_scene'].includes(name))data=true;
      return {data,error:null};
    }
  }};
</script>
<iframe id="hew-frame" title="Hew iframe" src="./hew-editor/?lizhi-model-queue=1" style="width:1280px;height:900px;border:0"></iframe>
</body></html>
